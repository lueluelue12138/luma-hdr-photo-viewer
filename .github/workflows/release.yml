name: Build full RTX installer and release draft from tag

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      NVIDIA_SDK_REPOSITORY: ${{ vars.NVIDIA_SDK_REPOSITORY }}
      NVIDIA_SDK_REVISION: ${{ vars.NVIDIA_SDK_REVISION }}
      NVIDIA_SDK_SHA256: ${{ vars.NVIDIA_SDK_SHA256 }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Check complete RTX build inputs
        env:
          SDK_ACCESS_CONFIGURED: ${{ secrets.NVIDIA_SDK_DEPLOY_KEY != '' }}
        run: |
          if ($env:SDK_ACCESS_CONFIGURED -ne 'true') { throw 'Configure the read-only NVIDIA_SDK_DEPLOY_KEY secret.' }
          if ($env:NVIDIA_SDK_REPOSITORY -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw 'Configure the private SDK repository.' }
          if ($env:NVIDIA_SDK_REVISION -notmatch '^[a-fA-F0-9]{40}$' -or $env:NVIDIA_SDK_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Pin the private SDK commit and archive SHA256.' }
          if (!(Test-Path packaging/RTX-EULA.rtf)) { throw 'NVIDIA runtime terms must accompany the application.' }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') { throw 'Invalid release tag.' }
          $project = [xml](Get-Content src/Luma.App/Luma.App.csproj -Raw)
          $version = [string]($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if (($env:RELEASE_TAG.Substring(1) -split '-', 2)[0] -ne $version) { throw 'Tag and source version differ.' }
          if (!(Test-Path -LiteralPath "docs/releases/$env:RELEASE_TAG.md")) { throw 'Commit version-specific release notes before tagging.' }

      - name: Set up tested .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check source and library behavior
        run: |
          python tests/check_public_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Public source check failed.' }
          dotnet run --project tests/Luma.Tests/Luma.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Core checks failed.' }

      - name: Check out pinned private SDK input with read-only access
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.NVIDIA_SDK_REPOSITORY }}
          ref: ${{ vars.NVIDIA_SDK_REVISION }}
          ssh-key: ${{ secrets.NVIDIA_SDK_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: artifacts/private-sdk

      - name: Verify and unpack licensed SDK
        run: ./scripts/Install-NvidiaSdk.ps1 -ArchivePath "$PWD/artifacts/private-sdk/RTX_Video_SDK_v1.1.0.zip"

      - name: Verify SDK-linked native rendering on the build machine
        run: |
          python -m pip install 'Pillow>=11.3,<13'
          if ($LASTEXITCODE -ne 0) { throw 'Image test dependency failed.' }
          ./scripts/Build-Native.ps1 -RequireNvidia -TestFixtures -OutputDirectory "$PWD/artifacts/ci-native-rtx"
          $env:LUMA_NATIVE_TEST_DLL = "$PWD/artifacts/ci-native-rtx/Luma.Native.dll"
          python tests/verify_native.py
          if ($LASTEXITCODE -ne 0) { throw 'SDK-linked native rendering checks failed.' }
          # Hosted CI has no RTX GPU. Actual NVIDIA evaluation is checked on
          # compatible hardware using the downloaded consumer package.

      - name: Build full RTX installer and portable ZIP
        run: ./scripts/Build-Release.ps1 -Variant rtx -Tag $env:RELEASE_TAG -Distribution -TestInstaller

      - name: Verify release bytes and isolated installation
        run: |
          python tests/verify_release.py --variant rtx
          if ($LASTEXITCODE -ne 0) { throw 'RTX package checks failed.' }
          python tests/verify_installer.py
          if ($LASTEXITCODE -ne 0) { throw 'Installer checks failed.' }

      - name: Preserve verified release files only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RTX-release-${{ github.ref_name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/release-rtx/*-setup.exe
            artifacts/release-rtx/*-portable.zip
            artifacts/release-rtx/SHA256SUMS.txt
            artifacts/release-rtx/build-info.json

  draft:
    needs: package
    runs-on: windows-2025
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Read release notes from exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download verified package files
        # Use the matching v7 artifact implementation; the release job does not
        # retrieve or expose the private SDK archive or build dependencies.
        shell: pwsh
        run: |
          $run = '${{ github.run_id }}'
          gh run download $run --name "RTX-release-$env:RELEASE_TAG" --dir release-files
          if ($LASTEXITCODE -ne 0) { throw 'Unable to retrieve verified release files.' }
          foreach ($line in Get-Content release-files/SHA256SUMS.txt) {
            $parts = $line -split '  ', 2
            if ($parts.Count -ne 2 -or [IO.Path]::GetFileName($parts[1]) -ne $parts[1]) { throw 'Invalid checksum entry.' }
            if ((Get-FileHash (Join-Path release-files $parts[1]) -Algorithm SHA256).Hash -ne $parts[0]) { throw 'Downloaded artifact checksum mismatch.' }
          }
          $metadata = Get-Content release-files/build-info.json -Raw | ConvertFrom-Json
          if ($metadata.commit -ne $env:RELEASE_COMMIT -or $metadata.sourceDirty) { throw 'Release provenance differs from the committed source.' }
          if ($metadata.variant -ne 'rtx' -or !$metadata.rtxHdr -or !$metadata.rtxVsr) { throw 'Refusing to publish an incomplete RTX package.' }
          $expected = @("Luma-$($env:RELEASE_TAG.Substring(1))-windows-x64-rtx-setup.exe", "Luma-$($env:RELEASE_TAG.Substring(1))-windows-x64-rtx-portable.zip", 'SHA256SUMS.txt', 'build-info.json')
          $actual = @(Get-ChildItem release-files -File | ForEach-Object Name)
          if ($actual.Count -ne 4 -or @($actual | Where-Object { $_ -notin $expected }).Count -ne 0) { throw 'Unexpected release files; never upload SDK build inputs.' }
          $tagCommit = gh api "repos/$env:GH_REPO/commits/$env:RELEASE_TAG" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:RELEASE_COMMIT) { throw 'Remote tag changed during the build.' }

      - name: Create or update draft only
        shell: pwsh
        run: |
          $notes = Get-Content -LiteralPath "docs/releases/$env:RELEASE_TAG.md" -Raw
          $quarkUrl = 'https://pan.quark.cn/s/109763c10614'
          if (!$notes.Contains($quarkUrl)) {
            $notes = $notes.TrimEnd() + "`n`n## 国内下载`n`n[夸克网盘下载]($quarkUrl)（安装版与便携版，由维护者手动同步；请按目录中的版本号选择，尚未同步时可使用 GitHub 附件）。`n"
          }
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8
          $existing = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -ne 'true') { throw 'Refusing to overwrite an already published release.' }
            gh release upload $env:RELEASE_TAG (Get-ChildItem release-files -File).FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Draft release asset upload failed.' }
            gh release edit $env:RELEASE_TAG --notes-file release-notes.md
          } else {
            $arguments = @('release','create',$env:RELEASE_TAG,'--verify-tag','--draft','--title',"Luma $env:RELEASE_TAG",'--notes-file','release-notes.md')
            if ($env:RELEASE_TAG.Contains('-')) { $arguments += '--prerelease' }
            $arguments += (Get-ChildItem release-files -File).FullName
            gh @arguments
          }
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation/upload failed.' }
